# ============================================================
#  PRODUCTION PROFILE — application-prod.properties
#  Giá trị nhạy cảm nên truyền qua Environment Variables
#  thay vì hardcode trực tiếp vào file này.
# ============================================================

# ===== PostgreSQL - PROD =====
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ===== JPA / Hibernate =====
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# PROD: dùng "validate" để Hibernate kiểm tra schema nhưng KHÔNG tự sửa DB
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Thymeleaf =====
# Tắt cache DEV, bật lại ở PROD để tăng hiệu năng
spring.thymeleaf.cache=true

# ===== Logging =====
logging.level.root=WARN
logging.level.fa.training.product_manager=INFO
logging.level.org.hibernate.SQL=OFF

# ===== Actuator — chỉ mở health & info =====
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.info.env.enabled=true

management.endpoint.env.enabled=false
management.endpoint.beans.enabled=false
management.endpoint.conditions.enabled=false
management.endpoint.configprops.enabled=false
management.endpoint.mappings.enabled=false
management.endpoint.threaddump.enabled=false
management.endpoint.heapdump.enabled=false
management.endpoint.shutdown.enabled=false
management.endpoint.logfile.enabled=false
management.endpoint.loggers.enabled=false
management.endpoint.scheduledtasks.enabled=false
management.endpoint.sessions.enabled=false
management.endpoint.quartz.enabled=false