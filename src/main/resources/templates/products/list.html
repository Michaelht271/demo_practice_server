<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Quản lý Sản phẩm</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <style>
        body { background-color: #f0f2f5; }
        .navbar-brand { font-weight: 700; letter-spacing: 1px; }
        .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        .table thead th { background-color: #343a40; color: #fff; }
        .badge-stock { font-size: .8rem; }
    </style>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-server me-2"></i>product-manager
        </a>
        <div>
            <a href="/" class="btn btn-outline-light btn-sm me-2">
                <i class="bi bi-house"></i> Dashboard
            </a>
            <a href="/products" class="btn btn-light btn-sm">
                <i class="bi bi-box-seam"></i> Products
            </a>
        </div>
    </div>
</nav>

<div class="container">

    <!-- Flash message -->
    <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMsg}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-box-seam me-2 text-primary"></i>Danh sách Sản phẩm</h4>
        <a href="/products/new" class="btn btn-primary">
            <i class="bi bi-plus-lg me-1"></i>Thêm sản phẩm
        </a>
    </div>

    <!-- Table -->
    <div class="card">
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover mb-0 align-middle">
                    <thead>
                    <tr>
                        <th style="width:60px">#ID</th>
                        <th>Tên sản phẩm</th>
                        <th>Mô tả</th>
                        <th class="text-end">Giá (VND)</th>
                        <th class="text-center">Tồn kho</th>
                        <th class="text-center">Ngày tạo</th>
                        <th class="text-center" style="width:130px">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <!-- Empty state -->
                    <tr th:if="${#lists.isEmpty(products)}">
                        <td colspan="7" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-1 d-block mb-2"></i>
                            Chưa có sản phẩm nào. <a href="/products/new">Thêm ngay</a>
                        </td>
                    </tr>
                    <!-- Data rows -->
                    <tr th:each="p : ${products}">
                        <td><span class="badge bg-secondary" th:text="${p.id}"></span></td>
                        <td class="fw-semibold" th:text="${p.name}"></td>
                        <td class="text-muted small"
                            th:text="${p.description != null} ? ${#strings.abbreviate(p.description, 60)} : '—'"></td>
                        <td class="text-end fw-bold text-success"
                            th:text="${#numbers.formatDecimal(p.price, 1, 'COMMA', 0, 'POINT')}"></td>
                        <td class="text-center">
                            <span class="badge badge-stock"
                                  th:classappend="${p.stock > 0 ? 'bg-success' : 'bg-danger'}"
                                  th:text="${p.stock}"></span>
                        </td>
                        <td class="text-center small text-muted"
                            th:text="${p.createdAt != null ? #temporals.format(p.createdAt, 'dd/MM/yyyy HH:mm') : '-'}"></td>
                        <td class="text-center">
                            <a th:href="@{/products/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-info me-1" title="Xem chi tiết">
                                <i class="bi bi-eye"></i>
                            </a>
                            <a th:href="@{/products/edit/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-primary me-1" title="Sửa">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <a th:href="@{/products/delete/{id}(id=${p.id})}"
                               class="btn btn-sm btn-outline-danger"
                               title="Xóa"
                               onclick="return confirm('Xác nhận xóa sản phẩm này?')">
                                <i class="bi bi-trash"></i>
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <!-- Footer count -->
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(products)}">
            Tổng: <strong th:text="${#lists.size(products)}"></strong> sản phẩm
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
